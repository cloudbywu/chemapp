[project]
name = "chemappdesign"
version = "0.1.0"
description = "Local-first analytical chemistry data processing and evidence review API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "cryptography>=44.0",
    "fastapi>=0.137.1",
    "joblib>=1.5.3",
    "lxml>=6.1.1",
    "nmrglue>=0.11,<0.12",
    "numpy>=2.4.6",
    "openai>=2.42.0",
    "pandas>=3.0.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rdkit>=2026.3.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "torch>=2.0",
    "tqdm>=4.68.3",
    "transformers>=5.13.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.0",
    "pytest>=9.1.0",
    "ruff==0.15.20",
]

[tool.ruff]
extend-exclude = ["vendor"]
