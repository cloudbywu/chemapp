name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - name: Restore CSP5 weights for health assertions
        run: python scripts/fetch_csp5_weights.py
      - name: Restore NMR2Struct cnmr_only weights for generator tests
        run: python scripts/fetch_nmr2struct_weights.py --variant cnmr_only
      - run: uv run --no-sync pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image from clean checkout
        run: docker build -f backend/Dockerfile -t chemapp-backend:ci .
      - name: Canary CSP5 weight load and inference
        run: >
          docker run --rm
          -e CHEMAPP_ACCESS_TOKEN=ci-access
          -e CHEMAPP_ADMIN_TOKEN=ci-admin
          -e "CHEMAPP_REVIEWER_TOKENS={}"
          -e CHEMAPP_LOCAL_ACCESS_BYPASS=1
          -e CHEMAPP_LOCAL_ADMIN_BYPASS=1
          chemapp-backend:ci
          /app/.venv/bin/python -c
          "from app.ml.forward_v1.csp5_scorer import Csp5ForwardScorer; s=Csp5ForwardScorer(device='cpu'); r=s.score_candidates([18.3,58.1],[{'candidate_id':'x','smiles':'CCO'}]); assert r['status']=='ok'"
      - name: Canary runtime health and fail-closed checks
        run: |
          docker run -d --name chemapp-health-ci             -e CHEMAPP_ACCESS_TOKEN=ci-access             -e CHEMAPP_ADMIN_TOKEN=ci-admin             -e "CHEMAPP_REVIEWER_TOKENS={}"             -e CHEMAPP_LOCAL_ACCESS_BYPASS=0             -e CHEMAPP_LOCAL_ADMIN_BYPASS=0             -p 127.0.0.1:8000:8000             chemapp-backend:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          curl -fsS http://127.0.0.1:8000/api/ready | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)
          test "$status" = "401"
          curl -fsS -H "X-ChemApp-Access-Token: ci-access" http://127.0.0.1:8000/api/health | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', d
          assert d['assets']['csp5_weights']['status'] == 'ok', d['assets']['csp5_weights']
          assert d['assets']['nmr_index_v2']['exists'] is False, d['assets']['nmr_index_v2']
          assert d['assets']['calibration_policy']['probability_claim_allowed'] is False, d['assets']['calibration_policy']
          print('health ok; csp5 ok; nmr_index_v2.exists=false without mounts; calibration fail-closed')
          "
      - name: Cleanup health-check container
        if: always()
        run: docker rm -f chemapp-health-ci >/dev/null 2>&1 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build
      - run: node --experimental-vm-modules scripts/verify-plotly-bundle.mjs

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image from clean checkout
        run: docker build -f frontend/Dockerfile -t chemapp-frontend:ci .
      - name: Verify nginx config inside image
        run: docker run --rm --add-host backend:127.0.0.1 --entrypoint nginx chemapp-frontend:ci -t

  backend-dep-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-hashes --no-emit-project -o /tmp/reqs.txt
      - name: pip-audit runtime dependencies
        # Accepted advisories (no fixed release available or not exploitable here):
        # - PYSEC-2025-194 (torch 2.12.1): torch.load RCE — ChemApp loads .pt
        #   files only with weights_only=True or from trusted local assets;
        #   torch 2.13.x compatibility upgrade is tracked separately.
        # - PYSEC-2026-3447 (setuptools 81.0.0): fix version 83.0.0 is not yet
        #   published on PyPI; setuptools is a torch build-support dependency.
        run: uvx pip-audit -r /tmp/reqs.txt --progress-spinner off --strict --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-3447
